<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NearU</title>
<style>
  body{font-family:sans-serif;margin:0;background:#f4f5fb;color:#222}
  header{background:#3F51B5;color:#fff;padding:16px;font-size:20px;font-weight:bold;display:flex;align-items:center;gap:12px}
  header button{width:auto;margin:0;padding:6px 12px;background:#fff3;font-size:14px}
  header .sp{flex:1}
  .box{padding:16px}
  input{width:100%;padding:12px;font-size:16px;box-sizing:border-box;margin-bottom:10px;border:1px solid #ccc;border-radius:8px}
  button{width:100%;padding:12px;font-size:16px;border:0;border-radius:8px;background:#3F51B5;color:#fff;margin:6px 0}
  button.off{background:#c62828}
  button.ok{background:#2e7d32}
  button:disabled{background:#999}
  #status,#loginMsg{margin:10px 0;font-size:14px;color:#555}
  h3{margin:18px 0 6px}
  .person{background:#fff;padding:12px;border-radius:8px;margin-bottom:8px;box-shadow:0 1px 3px #0002}
  #chat{display:none;flex-direction:column;height:100vh}
  #msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column}
  .m{max-width:75%;padding:8px 12px;border-radius:12px;margin-bottom:6px;word-wrap:break-word}
  .me{background:#3F51B5;color:#fff;align-self:flex-end}
  .them{background:#fff;align-self:flex-start;box-shadow:0 1px 3px #0002}
  #sendRow{display:flex;gap:8px;padding:10px;background:#fff;box-shadow:0 -1px 3px #0002}
  #sendRow input{margin:0;flex:1}
  #sendRow button{width:90px;margin:0}
</style>
</head>
<body>

<div id="login">
  <header>NearU</header>
  <div class="box">
    <p>आसपास के लोगों से जुड़ने के लिए Login करें।</p>
    <button data-a="login">Google से Login</button>
    <div id="loginMsg"></div>
  </div>
</div>

<div id="main" style="display:none">
  <header>NearU<span class="sp"></span><button data-a="logout">Logout</button></header>
  <div class="box">
    <input id="name" placeholder="आपका नाम">
    <button id="visBtn" data-a="vis">Visible ON करें</button>
    <button data-a="scan">आसपास के लोग खोजें</button>
    <div id="status">तैयार</div>
    <div id="out"></div>
  </div>
</div>

<div id="chat">
  <header><button data-a="back">← वापस</button><span id="chatTitle">Chat</span></header>
  <div id="msgs"></div>
  <div id="sendRow">
    <input id="msgInput" placeholder="संदेश लिखें" maxlength="500">
    <button data-a="send">भेजें</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, get, onValue, onDisconnect, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJhKln7MOf7cPkpjLKgOtajbMhmNzE_tA",
  authDomain: "nearu-8435f.firebaseapp.com",
  databaseURL: "https://nearu-8435f-default-rtdb.firebaseio.com",
  projectId: "nearu-8435f",
  storageBucket: "nearu-8435f.firebasestorage.app",
  messagingSenderId: "383886866215",
  appId: "1:383886866215:web:8dcca0d1e9297894051b02"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const myName = () => $("name").value.trim() || localStorage.getItem("nearuName") || "अनाम";

let myId = null, visible = false, timer = null, myPos = null;
let lastScan = [], incoming = {}, sent = {}, conns = {};
let chatWith = null, chatUnsub = null, unsubs = [];

function getPos() {
  return new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(e), { enableHighAccuracy: false, timeout: 40000, maximumAge: 60000 }));
}

async function publish() {
  if (!myId) return;
  try {
    myPos = await getPos();
    // सटीक पता नहीं, लगभग 150 मीटर के ग्रिड में गोल करके भेजते हैं
    const G = 0.0015;
    const rl = Math.round(myPos.lat / G) * G, rg = Math.round(myPos.lng / G) * G;
    await set(ref(db, "users/" + myId), { name: myName(), lat: +rl.toFixed(5), lng: +rg.toFixed(5), t: Date.now() });
    setStatus("Visible हैं ✔");
  } catch (e) { setStatus("लोकेशन/नेट की दिक्कत: " + e.message); }
}

async function setInvisible() {
  visible = false;
  clearInterval(timer);
  $("visBtn").textContent = "Visible ON करें";
  $("visBtn").className = "";
  if (myId) { try { await remove(ref(db, "users/" + myId)); } catch (e) {} }
}

async function toggleVisible() {
  if (!visible) {
    const name = $("name").value.trim();
    if (!name) { setStatus("पहले अपना नाम लिखें"); return; }
    localStorage.setItem("nearuName", name);
    visible = true;
    $("visBtn").textContent = "Invisible हो जाएँ";
    $("visBtn").className = "off";
    onDisconnect(ref(db, "users/" + myId)).remove();
    await publish();
    timer = setInterval(publish, 20000);
  } else {
    await setInvisible();
    setStatus("अब आप Invisible हैं");
  }
}

function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function scan() {
  setStatus("खोज रहे हैं...");
  try {
    myPos = await getPos();
    const snap = await get(ref(db, "users"));
    const data = snap.val() || {};
    const now = Date.now(), out = [];
    for (const id in data) {
      if (id === myId) continue;
      const u = data[id];
      if (now - u.t > 180000) continue;
      const d = dist(myPos, u);
      if (d <= 1000) out.push({ id, name: u.name, d });
    }
    out.sort((a, b) => a.d - b.d);
    lastScan = out;
    setStatus(out.length ? out.length + " लोग मिले" : "आसपास कोई Visible नहीं मिला");
    render();
  } catch (e) { setStatus("दिक्कत: " + e.message); }
}

function render() {
  let h = "";
  const inc = Object.entries(incoming);
  if (inc.length) {
    h += "<h3>मिली Requests</h3>";
    inc.forEach(([id, r]) => {
      h += `<div class="person"><b>${esc(r.name)}</b> आपसे जुड़ना चाहता है
        <button class="ok" data-a="acc" data-id="${esc(id)}" data-n="${esc(r.name)}">Accept</button>
        <button class="off" data-a="rej" data-id="${esc(id)}">Reject</button></div>`;
    });
  }
  const cs = Object.entries(conns);
  if (cs.length) {
    h += "<h3>आपके Connections</h3>";
    cs.forEach(([id, c]) => {
      h += `<div class="person"><b>${esc(c.name)}</b> ✔ Connected
        <button class="ok" data-a="chat" data-id="${esc(id)}" data-n="${esc(c.name)}">Chat खोलें</button>
        <button class="off" data-a="del" data-id="${esc(id)}">Connection हटाएँ</button></div>`;
    });
  }
  if (lastScan.length) {
    h += "<h3>आसपास के लोग</h3>";
    lastScan.forEach(p => {
      let btn;
      if (conns[p.id]) btn = "<div>✔ Connected</div>";
      else if (incoming[p.id]) btn = "<div>इन्होंने आपको Request भेजी है (ऊपर देखें)</div>";
      else if (sent[p.id]) btn = '<button disabled>Request भेजी गई</button>';
      else btn = `<button data-a="req" data-id="${esc(p.id)}">Request भेजें</button>`;
      h += `<div class="person"><b>${esc(p.name)}</b><br>लगभग ${Math.max(100, Math.round(p.d / 100) * 100)} मीटर दूर${btn}</div>`;
    });
  }
  $("out").innerHTML = h;
  if (chatWith && !conns[chatWith]) closeChat();
}

const chatId = other => [myId, other].sort().join("_");

function openChat(id, name) {
  if (!conns[id]) return;
  chatWith = id;
  $("chatTitle").textContent = name;
  $("main").style.display = "none";
  $("chat").style.display = "flex";
  $("msgs").innerHTML = "";
  const q = query(ref(db, "chats/" + chatId(id)), limitToLast(100));
  chatUnsub = onValue(q, s => {
    const data = s.val() || {};
    const list = Object.values(data).sort((a, b) => a.t - b.t);
    $("msgs").innerHTML = list.map(m =>
      `<div class="m ${m.from === myId ? "me" : "them"}">${esc(m.text)}</div>`).join("");
    $("msgs").scrollTop = $("msgs").scrollHeight;
  });
}

function closeChat() {
  if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  chatWith = null;
  $("chat").style.display = "none";
  $("main").style.display = "block";
}

async function sendMsg() {
  const text = $("msgInput").value.trim();
  if (!text || !chatWith || !conns[chatWith]) return;
  $("msgInput").value = "";
  await push(ref(db, "chats/" + chatId(chatWith)), { from: myId, text, t: Date.now() });
}

function startListeners() {
  unsubs.push(onValue(ref(db, "requests/" + myId), s => { incoming = s.val() || {}; render(); }));
  unsubs.push(onValue(ref(db, "sent/" + myId), s => { sent = s.val() || {}; render(); }));
  unsubs.push(onValue(ref(db, "connections/" + myId), s => { conns = s.val() || {}; render(); }));
}
function stopListeners() {
  unsubs.forEach(u => u()); unsubs = [];
  incoming = {}; sent = {}; conns = {}; lastScan = [];
}

onAuthStateChanged(auth, user => {
  if (user) {
    myId = user.uid;
    $("name").value = localStorage.getItem("nearuName") || user.displayName || "";
    $("login").style.display = "none";
    $("main").style.display = "block";
    startListeners();
  } else {
    myId = null;
    stopListeners();
    $("main").style.display = "none";
    $("chat").style.display = "none";
    $("login").style.display = "block";
  }
});

$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });

document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, n = b.dataset.n;
  try {
    if (a === "login") {
      $("loginMsg").textContent = "Login हो रहा है...";
      await signInWithPopup(auth, new GoogleAuthProvider());
      $("loginMsg").textContent = "";
    }
    else if (a === "logout") { await setInvisible(); closeChat(); await signOut(auth); }
    else if (a === "vis") await toggleVisible();
    else if (a === "scan") await scan();
    else if (a === "chat") openChat(id, n);
    else if (a === "back") closeChat();
    else if (a === "send") await sendMsg();
    else if (a === "req") {
      localStorage.setItem("nearuName", myName());
      await set(ref(db, `requests/${id}/${myId}`), { name: myName(), t: Date.now() });
      await set(ref(db, `sent/${myId}/${id}`), true);
    } else if (a === "acc") {
      await set(ref(db, `connections/${myId}/${id}`), { name: n, t: Date.now() });
      await set(ref(db, `connections/${id}/${myId}`), { name: myName(), t: Date.now() });
      await remove(ref(db, `requests/${myId}/${id}`));
      await remove(ref(db, `sent/${id}/${myId}`));
    } else if (a === "rej") {
      await remove(ref(db, `requests/${myId}/${id}`));
      await remove(ref(db, `sent/${id}/${myId}`));
    } else if (a === "del") {
      await remove(ref(db, `connections/${myId}/${id}`));
      await remove(ref(db, `connections/${id}/${myId}`));
    }
  } catch (err) {
    if (a === "login") $("loginMsg").textContent = "Login की दिक्कत: " + err.message;
    else setStatus("दिक्कत: " + err.message);
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>NearU</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#4f46e5">
<style>
  :root{--p:#4f46e5;--p2:#6366f1;--bg:#f3f4fb;--card:#fff;--tx:#1f2430;--mut:#6b7280;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;box-shadow:0 2px 10px #4f46e540}
  header .logo{font-size:21px;font-weight:800;letter-spacing:.3px}
  header .sp{flex:1}
  header .title{flex:1;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hb{background:#ffffff2e;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600;width:auto;margin:0}
  .wrap{padding:16px;max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px #1f243012}
  input,textarea,select{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;background:#fff;color:var(--tx);margin-bottom:10px;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--p2)}
  textarea{resize:none;height:76px}
  .btn{display:block;width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:14px;background:var(--p);color:#fff;margin:8px 0;font-family:inherit}
  .btn:active{transform:scale(.98)}
  .btn.ok{background:var(--ok)}
  .btn.bad{background:var(--bad)}
  .btn.gray{background:#eef0f5;color:#374151}
  .btn.sm{padding:10px 6px;font-size:14px;margin:0;border-radius:12px}
  .btn:disabled{background:#c7cbd6;color:#fff}
  .row{display:flex;gap:8px;margin-top:8px}
  .row .btn{flex:1}
  .pill{display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 14px;font-size:14px;color:var(--mut);margin:4px 0 14px;box-shadow:0 1px 6px #1f24300d}
  .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none}
  .dot.on{background:var(--ok);box-shadow:0 0 0 4px #16a34a22}
  h3{margin:20px 4px 8px;font-size:15px;color:#374151;display:flex;align-items:center;gap:8px}
  h3 .cnt{background:var(--p);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px}
  .ph{display:flex;gap:12px;align-items:center}
  .avc{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e0e7ff,#fce7f3);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .pi{min-width:0}
  .pn{font-weight:700;font-size:16px}
  .bio{font-size:14px;color:var(--mut);margin-top:2px;word-wrap:break-word}
  .meta{font-size:13px;color:var(--mut);margin-top:3px}
  .tag{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;font-size:12px;padding:2px 8px;margin-left:6px;font-weight:600}
  .tag.new{background:#fee2e2;color:#991b1b}
  .empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
  details.card summary{font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
  details.card summary::after{content:"▾";color:var(--mut)}
  details.card[open] summary::after{content:"▴"}
  .hint{font-size:13px;color:var(--mut);margin:8px 0 10px}
  #toast{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;z-index:50;background:#111827;color:#fff;padding:13px 16px;border-radius:14px;font-size:15px;box-shadow:0 6px 20px #00000040}

  #chat{display:none;position:fixed;inset:0;flex-direction:column;background:var(--bg);z-index:20}
  #chat header{position:static}
  #msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 12px;display:flex;flex-direction:column}
  .m{max-width:78%;padding:9px 13px 6px;border-radius:18px;margin-bottom:8px;word-wrap:break-word;line-height:1.35}
  .m small{display:block;font-size:11px;opacity:.65;margin-top:3px;text-align:right}
  .me{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .them{background:#fff;align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 1px 4px #1f24301a}
  #sendRow{flex:none;display:flex;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  #sendRow input{margin:0;flex:1;border-radius:999px;padding:12px 16px}
  #sendRow button{width:76px;margin:0;border-radius:999px;padding:12px 0;font-size:15px}
  .login{min-height:100vh;display:flex;flex-direction:column}
  .hero{text-align:center;padding:50px 20px 20px}
  .hero .big{font-size:56px}
  .hero h1{margin:6px 0 4px;font-size:30px;color:var(--p)}
  .hero p{color:var(--mut);margin:0 0 22px}
</style>
</head>
<body>

<div id="toast"></div>

<div id="login" class="login">
  <div class="hero">
    <div class="big">📍</div>
    <h1>NearU</h1>
    <p>आसपास के लोगों से अपनी मर्जी से जुड़ें</p>
  </div>
  <div class="wrap" style="width:100%">
    <button class="btn" data-a="login">Google से Login</button>
    <div id="loginMsg" class="hint" style="text-align:center"></div>
  </div>
</div>

<div id="main" style="display:none">
  <header><span class="logo">NearU</span><span class="sp"></span><button class="hb" data-a="logout">Logout</button></header>
  <div class="wrap">
    <div class="card">
      <input id="name" placeholder="आपका नाम" maxlength="40" style="margin-bottom:0">
    </div>
    <details class="card">
      <summary>मेरी Profile</summary>
      <p class="hint">अवतार और बायो उन्हें दिखेंगे जिनके आप आसपास Visible हैं या जिन्हें आप Request भेजते हैं। फोन नंबर या पता न लिखें।</p>
      <select id="av">
        <option>🙂</option><option>😎</option><option>🤓</option><option>🥳</option>
        <option>🧑‍💻</option><option>🎧</option><option>📚</option><option>⚽</option>
        <option>🎨</option><option>🌸</option><option>🐱</option><option>🦁</option>
      </select>
      <textarea id="bio" placeholder="अपने बारे में कुछ लिखें (150 अक्षर तक)" maxlength="150"></textarea>
      <button class="btn" data-a="saveProfile" style="margin-bottom:0">Profile सेव करें</button>
    </details>
    <button id="visBtn" class="btn" data-a="vis">👁 Visible ON करें</button>
    <button class="btn gray" data-a="scan">🔍 आसपास के लोग खोजें</button>
    <button id="notifBtn" class="btn gray" data-a="notif">🔔 Notifications चालू करें</button>
    <div id="notifHint" class="hint" style="margin-top:-2px">नई Request या संदेश आने पर बताएगा। ऐप खुला या बैकग्राउंड में हो तभी।</div>
    <div class="pill"><span id="dot" class="dot"></span><span id="status">तैयार</span></div>
    <div id="out"></div>
  </div>
</div>

<div id="chat">
  <header>
    <button class="hb" data-a="back">←</button>
    <span id="chatTitle" class="title">Chat</span>
    <button class="hb" data-a="blockChat">Block</button>
    <button class="hb" data-a="reportChat">Report</button>
  </header>
  <div id="msgs"></div>
  <div id="sendRow">
    <input id="msgInput" placeholder="संदेश लिखें" maxlength="500" autocomplete="off">
    <button class="btn" data-a="send">भेजें</button>
  </div>
</div>

<script>window.addEventListener('error',function(e){var m=document.getElementById('loginMsg');if(m)m.textContent='गलती: '+e.message});window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('loginMsg');if(m)m.textContent='गलती: '+(e.reason&&e.reason.message||e.reason)});</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, remove, get, onValue, onDisconnect, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJhKln7MOf7cPkpjLKgOtajbMhmNzE_tA",
  authDomain: "nearu-8435f.firebaseapp.com",
  databaseURL: "https://nearu-8435f-default-rtdb.firebaseio.com",
  projectId: "nearu-8435f",
  storageBucket: "nearu-8435f.firebasestorage.app",
  messagingSenderId: "383886866215",
  appId: "1:383886866215:web:8dcca0d1e9297894051b02"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const myName = () => $("name").value.trim() || localStorage.getItem("nearuName") || "अनाम";
const myBio = () => $("bio").value.trim().slice(0, 150);
const myAv = () => $("av").value || "🙂";
const head = (x, extra) => `<div class="ph"><div class="avc">${esc(x.av || "🙂")}</div><div class="pi"><div class="pn">${esc(x.name || "अनाम")}${extra || ""}</div>${x.bio ? `<div class="bio">${esc(x.bio)}</div>` : ""}</div></div>`;
const hhmm = t => { try { return new Date(t).toLocaleTimeString("hi-IN", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };

let myId = null, visible = false, timer = null, myPos = null;
let lastScan = [], incoming = {}, sent = {}, conns = {}, blocked = {}, blockedBy = {};
let chatWith = null, chatName = "", chatUnsub = null, unsubs = [];
let reqSeen = null, chatWatch = {}, lastKey = {}, unread = {}, toastTimer = null;
const isHidden = id => !!(blocked[id] || blockedBy[id]);

/* ---------- Notifications ---------- */
function notifState() {
  return ("Notification" in window) && Notification.permission === "granted" && localStorage.getItem("nearuNotif") !== "0";
}
function updateNotifBtn() {
  const b = $("notifBtn");
  if (!("Notification" in window)) { b.textContent = "🔔 इस ब्राउज़र में उपलब्ध नहीं"; b.disabled = true; return; }
  if (Notification.permission === "denied") { b.textContent = "🔕 अनुमति बंद है (Settings में Allow करें)"; return; }
  b.textContent = notifState() ? "🔕 Notifications बंद करें" : "🔔 Notifications चालू करें";
}
function showToast(t) {
  const el = $("toast");
  el.textContent = t; el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 4000);
}
async function notify(title, body, tag) {
  if (document.visibilityState === "visible") {
    showToast(title + " — " + body);
    try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
    return;
  }
  if (!notifState()) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, { body, tag, icon: "icon.svg", badge: "icon.svg", vibrate: [200, 100, 200], renotify: true });
  } catch (e) {}
}
async function toggleNotif() {
  if (!("Notification" in window)) { setStatus("इस ब्राउज़र में Notification उपलब्ध नहीं"); return; }
  if (notifState()) { localStorage.setItem("nearuNotif", "0"); setStatus("Notifications बंद"); updateNotifBtn(); return; }
  if (Notification.permission === "default") {
    const p = await Notification.requestPermission();
    if (p !== "granted") { setStatus("अनुमति नहीं मिली"); updateNotifBtn(); return; }
  }
  if (Notification.permission === "denied") { setStatus("Settings → Apps → NearU → Notifications में Allow करें"); updateNotifBtn(); return; }
  localStorage.setItem("nearuNotif", "1");
  updateNotifBtn();
  setStatus("Notifications चालू ✔");
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification("NearU", { body: "Notifications चालू हो गईं ✔", icon: "icon.svg" });
  } catch (e) {}
}
function updateTitle() {
  const n = Object.keys(unread).length + Object.keys(incoming).filter(id => !isHidden(id)).length;
  document.title = (n ? "(" + n + ") " : "") + "NearU";
  try { if (navigator.setAppBadge) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {}
}
const chatId = other => [myId, other].sort().join("_");
function markSeen(id) {
  try { localStorage.setItem("nearuSeen_" + chatId(id), String(Date.now())); } catch (e) {}
  delete unread[id];
}
function attachWatch(id) {
  const q = query(ref(db, "chats/" + chatId(id)), limitToLast(1));
  let first = true;
  chatWatch[id] = onValue(q, s => {
    const v = s.val();
    if (!v) { first = false; return; }
    const key = Object.keys(v)[0], m = v[key];
    if (first) {
      first = false; lastKey[id] = key;
      const ls = +localStorage.getItem("nearuSeen_" + chatId(id)) || 0;
      if (m.from !== myId && m.t > ls) { unread[id] = true; render(); }
      return;
    }
    if (key === lastKey[id]) return;
    lastKey[id] = key;
    if (m.from === myId) return;
    if (chatWith === id && document.visibilityState === "visible") { markSeen(id); return; }
    unread[id] = true; render();
    notify((conns[id] && conns[id].name) || "नया संदेश", String(m.text || "").slice(0, 80), "msg-" + id);
  }, () => {});
}
function syncChatWatchers() {
  const want = new Set(Object.keys(conns).filter(id => !isHidden(id)));
  for (const id of Object.keys(chatWatch)) {
    if (!want.has(id)) { chatWatch[id](); delete chatWatch[id]; delete lastKey[id]; delete unread[id]; }
  }
  want.forEach(id => { if (!chatWatch[id]) attachWatch(id); });
}

/* ---------- Profile / Location ---------- */
function saveProfileLocal() {
  localStorage.setItem("nearuName", $("name").value.trim());
  localStorage.setItem("nearuBio", myBio());
  localStorage.setItem("nearuAv", myAv());
}

function getPos() {
  return new Promise((res, rej) =>
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude }),
      e => rej(e), { enableHighAccuracy: false, timeout: 40000, maximumAge: 60000 }));
}

function setVisibleUI(on) {
  $("visBtn").textContent = on ? "🙈 Invisible हो जाएँ" : "👁 Visible ON करें";
  $("visBtn").className = on ? "btn bad" : "btn";
  $("dot").className = on ? "dot on" : "dot";
}

async function publish() {
  if (!myId) return;
  try {
    myPos = await getPos();
    const G = 0.0015;
    const rl = Math.round(myPos.lat / G) * G, rg = Math.round(myPos.lng / G) * G;
    await set(ref(db, "users/" + myId), {
      name: myName(), bio: myBio(), av: myAv(),
      lat: +rl.toFixed(5), lng: +rg.toFixed(5), t: Date.now()
    });
    setStatus("आप Visible हैं ✔");
  } catch (e) { setStatus("लोकेशन/नेट की दिक्कत: " + e.message); }
}

async function setInvisible() {
  visible = false;
  clearInterval(timer);
  setVisibleUI(false);
  if (myId) { try { await remove(ref(db, "users/" + myId)); } catch (e) {} }
}

async function toggleVisible() {
  if (!visible) {
    const name = $("name").value.trim();
    if (!name) { setStatus("पहले अपना नाम लिखें"); return; }
    saveProfileLocal();
    visible = true;
    setVisibleUI(true);
    onDisconnect(ref(db, "users/" + myId)).remove();
    await publish();
    timer = setInterval(publish, 20000);
  } else {
    await setInvisible();
    setStatus("अब आप Invisible हैं");
  }
}

function dist(a, b) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

async function scan() {
  setStatus("खोज रहे हैं...");
  try {
    myPos = await getPos();
    const snap = await get(ref(db, "users"));
    const data = snap.val() || {};
    const now = Date.now(), out = [];
    for (const id in data) {
      if (id === myId || isHidden(id)) continue;
      const u = data[id];
      if (now - u.t > 180000) continue;
      const d = dist(myPos, u);
      if (d <= 1000) out.push({ id, name: u.name, bio: u.bio || "", av: u.av || "🙂", d });
    }
    out.sort((a, b) => a.d - b.d);
    lastScan = out;
    setStatus(out.length ? out.length + " लोग मिले" : "आसपास कोई Visible नहीं मिला");
    render();
  } catch (e) { setStatus("दिक्कत: " + e.message); }
}

/* ---------- Render ---------- */
function render() {
  let h = "";
  const inc = Object.entries(incoming).filter(([id]) => !isHidden(id));
  if (inc.length) {
    h += `<h3>📩 मिली Requests <span class="cnt">${inc.length}</span></h3>`;
    inc.forEach(([id, r]) => {
      h += `<div class="card">${head(r)}<div class="meta">आपसे जुड़ना चाहता है</div>
        <button class="btn ok" data-a="acc" data-id="${esc(id)}" data-n="${esc(r.name)}">Accept</button>
        <div class="row">
          <button class="btn sm gray" data-a="rej" data-id="${esc(id)}">Reject</button>
          <button class="btn sm gray" data-a="blk" data-id="${esc(id)}" data-n="${esc(r.name)}">Block</button>
          <button class="btn sm gray" data-a="rep" data-id="${esc(id)}" data-n="${esc(r.name)}">Report</button>
        </div></div>`;
    });
  }
  const cs = Object.entries(conns).filter(([id]) => !isHidden(id));
  h += `<h3>🤝 आपके Connections ${cs.length ? `<span class="cnt">${cs.length}</span>` : ""}</h3>`;
  if (!cs.length) h += `<div class="empty">अभी कोई Connection नहीं।<br>आसपास के लोग खोजकर Request भेजें।</div>`;
  cs.forEach(([id, c]) => {
    const tg = unread[id] ? '<span class="tag new">🔴 नया संदेश</span>' : '<span class="tag">Connected</span>';
    h += `<div class="card">${head(c, tg)}
      <button class="btn" data-a="chat" data-id="${esc(id)}" data-n="${esc(c.name)}">💬 Chat खोलें</button>
      <div class="row">
        <button class="btn sm gray" data-a="del" data-id="${esc(id)}">हटाएँ</button>
        <button class="btn sm gray" data-a="blk" data-id="${esc(id)}" data-n="${esc(c.name)}">Block</button>
        <button class="btn sm gray" data-a="rep" data-id="${esc(id)}" data-n="${esc(c.name)}">Report</button>
      </div></div>`;
  });
  const sl = lastScan.filter(p => !isHidden(p.id));
  if (sl.length) {
    h += `<h3>📍 आसपास के लोग <span class="cnt">${sl.length}</span></h3>`;
    sl.forEach(p => {
      let btn;
      if (conns[p.id]) btn = '<div class="meta">✔ पहले से Connected</div>';
      else if (incoming[p.id]) btn = '<div class="meta">इन्होंने आपको Request भेजी है (ऊपर देखें)</div>';
      else if (sent[p.id]) btn = '<button class="btn" disabled>Request भेजी गई</button>';
      else btn = `<button class="btn" data-a="req" data-id="${esc(p.id)}">Request भेजें</button>`;
      h += `<div class="card">${head(p)}<div class="meta">लगभग ${Math.max(100, Math.round(p.d / 100) * 100)} मीटर दूर</div>${btn}
        <div class="row">
          <button class="btn sm gray" data-a="blk" data-id="${esc(p.id)}" data-n="${esc(p.name)}">Block</button>
          <button class="btn sm gray" data-a="rep" data-id="${esc(p.id)}" data-n="${esc(p.name)}">Report</button>
        </div></div>`;
    });
  }
  const bl = Object.entries(blocked);
  if (bl.length) {
    h += `<h3>🚫 Blocked लोग</h3>`;
    bl.forEach(([id, b]) => {
      h += `<div class="card"><div class="ph"><div class="avc">🚫</div><div class="pi"><div class="pn">${esc(b.name || "अनाम")}</div></div></div>
        <button class="btn gray" data-a="unb" data-id="${esc(id)}">Unblock</button></div>`;
    });
  }
  $("out").innerHTML = h;
  if (chatWith && (!conns[chatWith] || isHidden(chatWith))) closeChat();
  updateTitle();
}

/* ---------- Block / Report ---------- */
async function blockUser(id, name) {
  if (!confirm(name + " को Block करें?\nConnection, Requests और Chat बंद हो जाएँगे।")) return false;
  try {
    await set(ref(db, `blocks/${myId}/${id}`), { name: name || "अनाम", t: Date.now() });
    await set(ref(db, `blockedBy/${id}/${myId}`), true);
    const dels = [
      `connections/${myId}/${id}`, `connections/${id}/${myId}`,
      `requests/${myId}/${id}`, `requests/${id}/${myId}`,
      `sent/${myId}/${id}`, `sent/${id}/${myId}`
    ];
    for (const p of dels) { try { await remove(ref(db, p)); } catch (e) {} }
    lastScan = lastScan.filter(p => p.id !== id);
    setStatus(name + " Block हो गया");
    return true;
  } catch (e) { setStatus("Block में दिक्कत: " + e.message); return false; }
}

async function unblockUser(id) {
  try {
    await remove(ref(db, `blocks/${myId}/${id}`));
    await remove(ref(db, `blockedBy/${id}/${myId}`));
    setStatus("Unblock हो गया");
  } catch (e) { setStatus("दिक्कत: " + e.message); }
}

async function reportUser(id, name) {
  const reason = prompt(name + " की Report का कारण लिखें (200 अक्षर तक):");
  if (!reason || !reason.trim()) return;
  try {
    await push(ref(db, "reports"), {
      by: myId, against: id, againstName: String(name || "").slice(0, 40),
      reason: reason.trim().slice(0, 200), t: Date.now()
    });
    setStatus("Report भेज दी गई। धन्यवाद।");
  } catch (e) { setStatus("Report में दिक्कत: " + e.message); }
}

/* ---------- Chat ---------- */
function scrollMsgs() { const m = $("msgs"); m.scrollTop = m.scrollHeight; }

function openChat(id, name) {
  if (!conns[id] || isHidden(id)) return;
  chatWith = id; chatName = name;
  markSeen(id); updateTitle();
  $("chatTitle").textContent = name;
  $("main").style.display = "none";
  $("chat").style.display = "flex";
  $("msgs").innerHTML = "";
  const q = query(ref(db, "chats/" + chatId(id)), limitToLast(100));
  chatUnsub = onValue(q, s => {
    const data = s.val() || {};
    const list = Object.values(data).sort((a, b) => a.t - b.t);
    $("msgs").innerHTML = list.length
      ? list.map(m => `<div class="m ${m.from === myId ? "me" : "them"}">${esc(m.text)}<small>${hhmm(m.t)}</small></div>`).join("")
      : '<div class="empty">अभी कोई संदेश नहीं। पहला संदेश भेजें 👋</div>';
    scrollMsgs();
    if (document.visibilityState === "visible") markSeen(id);
  });
}

function closeChat() {
  if (chatWith) markSeen(chatWith);
  if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  chatWith = null;
  $("chat").style.display = "none";
  $("main").style.display = "block";
  updateTitle();
}

async function sendMsg() {
  const text = $("msgInput").value.trim();
  if (!text || !chatWith || !conns[chatWith] || isHidden(chatWith)) return;
  $("msgInput").value = "";
  try {
    await push(ref(db, "chats/" + chatId(chatWith)), { from: myId, text, t: Date.now() });
    $("msgInput").focus();
  } catch (e) { setStatus("संदेश नहीं गया: " + e.message); }
}

/* ---------- Listeners ---------- */
function startListeners() {
  unsubs.push(onValue(ref(db, "requests/" + myId), s => {
    const nv = s.val() || {};
    if (reqSeen !== null) {
      for (const id in nv) {
        if (!reqSeen.has(id) && !isHidden(id)) notify("नई Request", (nv[id].name || "कोई") + " आपसे जुड़ना चाहता है", "req-" + id);
      }
    }
    reqSeen = new Set(Object.keys(nv));
    incoming = nv; render();
  }));
  unsubs.push(onValue(ref(db, "sent/" + myId), s => { sent = s.val() || {}; render(); }));
  unsubs.push(onValue(ref(db, "connections/" + myId), s => { conns = s.val() || {}; syncChatWatchers(); render(); }));
  unsubs.push(onValue(ref(db, "blocks/" + myId), s => { blocked = s.val() || {}; syncChatWatchers(); render(); }));
  unsubs.push(onValue(ref(db, "blockedBy/" + myId), s => { blockedBy = s.val() || {}; syncChatWatchers(); render(); }));
}
function stopListeners() {
  unsubs.forEach(u => u()); unsubs = [];
  Object.values(chatWatch).forEach(u => u());
  chatWatch = {}; lastKey = {}; unread = {}; reqSeen = null;
  incoming = {}; sent = {}; conns = {}; blocked = {}; blockedBy = {}; lastScan = [];
  document.title = "NearU";
}

onAuthStateChanged(auth, user => {
  if (user) {
    myId = user.uid;
    $("name").value = localStorage.getItem("nearuName") || user.displayName || "";
    $("bio").value = localStorage.getItem("nearuBio") || "";
    $("av").value = localStorage.getItem("nearuAv") || "🙂";
    $("login").style.display = "none";
    $("main").style.display = "block";
    updateNotifBtn();
    startListeners();
    render();
  } else {
    myId = null;
    stopListeners();
    $("main").style.display = "none";
    $("chat").style.display = "none";
    $("login").style.display = "flex";
  }
});

$("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") sendMsg(); });
$("msgInput").addEventListener("focus", () => setTimeout(scrollMsgs, 300));
$("toast").addEventListener("click", () => { $("toast").style.display = "none"; });

document.addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]");
  if (!b) return;
  const a = b.dataset.a, id = b.dataset.id, n = b.dataset.n;
  try {
    if (a === "login") {
      $("loginMsg").textContent = "Login हो रहा है...";
      await signInWithPopup(auth, new GoogleAuthProvider());
      $("loginMsg").textContent = "";
    }
    else if (a === "logout") { await setInvisible(); closeChat(); await signOut(auth); }
    else if (a === "saveProfile") {
      saveProfileLocal();
      if (visible) await publish();
      setStatus("Profile सेव हो गई ✔");
    }
    else if (a === "notif") await toggleNotif();
    else if (a === "vis") await toggleVisible();
    else if (a === "scan") await scan();
    else if (a === "chat") openChat(id, n);
    else if (a === "back") closeChat();
    else if (a === "send") await sendMsg();
    else if (a === "blk") await blockUser(id, n);
    else if (a === "unb") await unblockUser(id);
    else if (a === "rep") await reportUser(id, n);
    else if (a === "blockChat") { if (chatWith) { const ok = await blockUser(chatWith, chatName); if (ok) closeChat(); } }
    else if (a === "reportChat") { if (chatWith) await reportUser(chatWith, chatName); }
    else if (a === "req") {
      saveProfileLocal();
      await set(ref(db, `requests/${id}/${myId}`), { name: myName(), bio: myBio(), av: myAv(), t: Date.now() });
      await set(ref(db, `sent/${myId}/${id}`), true);
    } else if (a === "acc") {
      const r = incoming[id] || {};
      await set(ref(db, `connections/${myId}/${id}`), { name: n, bio: r.bio || "", av: r.av || "🙂", t: Date.now() });
      await set(ref(db, `connections/${id}/${myId}`), { name: myName(), bio: myBio(), av: myAv(), t: Date.now() });
      await remove(ref(db, `requests/${myId}/${id}`));
      await remove(ref(db, `sent/${id}/${myId}`));
    } else if (a === "rej") {
      await remove(ref(db, `requests/${myId}/${id}`));
      await remove(ref(db, `sent/${id}/${myId}`));
    } else if (a === "del") {
      await remove(ref(db, `connections/${myId}/${id}`));
      await remove(ref(db, `connections/${id}/${myId}`));
    }
  } catch (err) {
    if (a === "login") $("loginMsg").textContent = "Login की दिक्कत: " + err.message;
    else setStatus("दिक्कत: " + err.message);
  }
});
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
